name: Build Unsigned BookPlayer IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 27.1
        run: |
          ls -1 /Applications | grep -E '^Xcode_27' || true
          sudo xcode-select -s "/Applications/Xcode_27.1.app"
          xcodebuild -version

      - name: Create xcconfig files
        run: |
          cp ./BuildConfiguration/Debug.template.xcconfig ./BuildConfiguration/Debug.xcconfig
          if [ -f ./BuildConfiguration/Release.template.xcconfig ]; then
            cp ./BuildConfiguration/Release.template.xcconfig ./BuildConfiguration/Release.xcconfig
          fi

      - name: Patch AppGroup containerURL fallbacks
        run: |
          python3 -c '
          import glob, re
          fallback = " ?? FileManager.default.urls(for: .documentDirectory, in: .userDomainMask).first!"
          pattern = re.compile(r"(FileManager\.default\.containerURL\s*\(\s*forSecurityApplicationGroupIdentifier:\s*[^)]+\))!")
          for path in glob.glob("**/*.swift", recursive=True):
              with open(path, "r", encoding="utf-8") as f:
                  content = f.read()
              new_content, count = pattern.subn(r"\1" + fallback, content)
              if count > 0:
                  print(f"Patched {count} occurrence(s) in {path}")
                  with open(path, "w", encoding="utf-8") as f:
                      f.write(new_content)
          '

      - name: Resolve SPM dependencies
        run: xcodebuild -resolvePackageDependencies

      - name: Build Unsigned Archive
        run: |
          xcodebuild archive \
            -project BookPlayer.xcodeproj \
            -scheme BookPlayer \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath $RUNNER_TEMP/BookPlayer.xcarchive \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          mkdir -p $RUNNER_TEMP/Payload
          cp -r $RUNNER_TEMP/BookPlayer.xcarchive/Products/Applications/BookPlayer.app $RUNNER_TEMP/Payload/
          cd $RUNNER_TEMP
          zip -r BookPlayer.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BookPlayer-Unsigned-IPA
          path: ${{ runner.temp }}/BookPlayer.ipa
